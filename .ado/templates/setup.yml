steps:
  - script: |
      git checkout --track "origin/${BUILD_SOURCEBRANCH#refs/heads/}"
      git pull
    displayName: Re-attach head

  - task: UseNode@1
    displayName: Install Node.js $(nodeVersion)
    inputs:
      version: $(nodeVersion).x

  - script: |
      git config user.name "OGX bot"
      git config user.email 57645319+office-ogx-auth-helper[bot]@users.noreply.github.com
    displayName: Configure git user

  # Configure npm to use the internal feed from REGISTRY_URL.
  - script: echo 'registry=$(REGISTRY_URL)' >> .npmrc
    displayName: Configure npm registry

  - script: |
      echo "node: `node -v`"
      echo "yarn: `yarn -v`"
      echo "npm: `npm -v`"
      printenv | sort
      git --no-pager config list
      npm config list
    displayName: Show environment

  - task: npmAuthenticate@0
    displayName: Authenticate npm
    inputs:
      workingFile: $(Build.SourcesDirectory)/.npmrc

  # yarn install's auth errors can be very unclear, so do a quick check first.
  - script: yarn npm info keyborg
    displayName: Verify registry authentication

  - script: yarn install --immutable
    displayName: Install dependencies
