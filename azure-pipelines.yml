pr: none
trigger: none

parameters:
  - name: prerelease
    displayName: Publish a prerelease
    type: boolean
    default: true
  - name: prereleaseTag
    displayName: Prerelease tag
    type: string
    default: canary
  - name: publishVersion
    displayName: Publish version
    type: string
    default: minor
    values:
      - patch
      - minor
      - major

variables:
  - group: 'Github and NPM secrets'
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - stage: main
        jobs:
          - job: Release
            pool:
              name: '1ES-Host-Ubuntu'
              image: '1ES-PT-Ubuntu-20.04'
              os: linux
            workspace:
              clean: all
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(System.DefaultWorkingDirectory)
                  artifactName: output
            steps:
              - checkout: self
                clean: true

              - task: CmdLine@2
                displayName: Re-attach head
                inputs:
                  script: |
                    git checkout --track "origin/${BUILD_SOURCEBRANCH//refs\/heads\/}"
                    git pull

              - task: NodeTool@0
                displayName: Use Node 24.x
                inputs:
                  versionSpec: 24.x

              # Enabling corepack is not necessary with the locally committed yarnPath
              - script: yarn install --immutable
                displayName: yarn install

              - script: |
                  git config user.name "Keyborg Build"
                  git config user.email "fluentui-internal@service.microsoft.com"
                  git remote set-url origin "https://$(githubUser):$GITHUB_PAT@github.com/microsoft/keyborg.git"
                displayName: Authenticate git for pushes
                env:
                  GITHUB_PAT: $(githubPAT)

              - script: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
                displayName: Write npmrc for publish token
                env:
                  NPM_TOKEN: $(npmToken)

              - script: yarn release ${{ parameters.publishVersion }} --ci
                displayName: Publish (official)
                condition: eq(${{ parameters.prerelease }}, false)
                env:
                  NPM_TOKEN: $(npmToken)

              - script: yarn release ${{ parameters.publishVersion }} --preRelease ${{ parameters.prereleaseTag }} --ci
                displayName: Publish (prerelease)
                condition: eq(${{ parameters.prerelease }}, true)
                env:
                  NPM_TOKEN: $(npmToken)
