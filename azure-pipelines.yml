# Build and pack a versioned package without changing git, publish that artifact through ESRP,
# then rerun release-it from the original commit to push the matching version commit and tag.

name: keyborg-release-$(Date:yyyy-MM-dd).$(Rev:rr)

pr: none
trigger: none

# Version bump parameters are set at pipeline queue time.
parameters:
  - name: prerelease
    displayName: Publish a prerelease
    type: boolean
    default: true
  - name: prereleaseTag
    displayName: Prerelease tag
    type: string
    default: canary
  - name: publishVersion
    displayName: Publish version
    type: string
    default: minor
    values:
      - patch
      - minor
      - major
  - name: dryRun
    displayName: Dry run (no publish or push)
    type: boolean
    default: false

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

variables:
  - template: /.ado/templates/readonly-variables.yml
    parameters:
      variables:
        nodeVersion: 24

        # Force multiline bash scripts to exit with an error if any line fails
        # (includes ADO defaults plus errexit:errtrace)
        SHELLOPTS: braceexpand:hashall:interactive-comments:errexit:errtrace

        # Internal npm feed (with npmjs.org as upstream) for build/publish in 1ES PT
        REGISTRY_URL: https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/
        # Yarn v4 doesn't respect .npmrc, so set config with YARN_* env
        YARN_NPM_REGISTRY_SERVER: $(REGISTRY_URL)
        YARN_NPM_ALWAYS_AUTH: 1
        YARN_NPMRC_AUTH_ENABLED: 1

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
    featureFlags:
      incrementalSDLSourceAnalysis: true
    sdl:
      codeql:
        runSourceLanguagesInSourceAnalysis: true
        enabledOnNonDefaultBranches: false
    settings:
      networkIsolationPolicy: DefaultDeny,AzureActiveDirectory,AzureKeyVault,AzureStorage,GitHub

    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build and pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            variables:
              - name: artifactPath
                value: $(Build.StagingDirectory)/packed
                readonly: true
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: packed
                  path: $(artifactPath)
            steps:
              - template: /.ado/templates/setup.yml@self

              # Locally update the package version and changelog, without committing or publishing.
              - ${{ if eq(parameters.prerelease, false) }}:
                  - script: yarn release --no-git '${{ parameters.publishVersion }}'
                    displayName: Prepare official release
              - ${{ else }}:
                  - script: yarn release --no-git '${{ parameters.publishVersion }}' --preRelease '${{ parameters.prereleaseTag }}'
                    displayName: Prepare prerelease

              # The build runs as a prepack script.
              - script: |
                  mkdir -p '$(artifactPath)'
                  npm pack --pack-destination '$(artifactPath)'
                displayName: Pack package

      - stage: publish
        displayName: Publish
        dependsOn: build
        jobs:
          - job: npm_publish
            displayName: Publish npm package
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            variables:
              - name: artifactPath
                value: $(Agent.BuildDirectory)/packed
                readonly: true
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: packed
                  targetPath: $(artifactPath)
            steps:
              - script: ls -R '$(artifactPath)'
                displayName: Show artifact contents

              - task: EsrpRelease@12
                displayName: Publish to npm
                condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))
                inputs:
                  folderlocation: $(artifactPath)
                  contenttype: npm
                  # the release is auto-approved (this only controls owners in the ESRP release UI)
                  owners: marata@microsoft.com
                  approvers: rsudarikov@microsoft.com
                  ${{ if eq(parameters.prerelease, true) }}:
                    # this is used as the npm dist-tag
                    productstate: ${{ parameters.prereleaseTag }}
                  # Standard Fluent/OGX team ESRP setup:
                  # "OGX JSHost" ESRP client ID
                  clientid: 0a35e01f-eadf-420a-a2bf-def002ba898d
                  # Azure service connection name (to Torus tenant)
                  connectedservicename: ESRP-JSHost3
                  usemanagedidentity: false
                  # Torus tenant ID
                  domaintenantid: cdc5aeea-15c5-4db6-b079-fcadd2505dc2
                  # Key vault in the Torus tenant
                  keyvaultname: OGX-JSHost-KV
                  authcertname: OGX-JSHost-Auth4
                  signcertname: OGX-JSHost-Sign3

      - stage: push
        displayName: Push to git
        dependsOn: publish
        jobs:
          - job: push
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            steps:
              - template: /.ado/templates/setup.yml@self

              # Get a token for the office-ogx-auth-helper app
              - task: AzureCLI@2
                name: createToken
                displayName: Create GitHub App token
                inputs:
                  azureSubscription: ogx-oss-release-bot # service connection name
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    yarn beachball-auth-helper create-github-app-token \
                      --app-client-id Iv23ligBoU5jc9SIFnGR \
                      --key-id https://ogx-oss-release-keyvault.vault.azure.net/keys/office-ogx-auth-helper-key \
                      --repository '$(Build.Repository.Name)' \
                      --permissions 'contents: write' \
                     --ci-output-name GITHUB_TOKEN

              # Recreate the published version bump, then commit, tag, and push it with release-it.
              # Authenticate as the github app by overriding the persisted extraheader (a 1ES PT
              # step forces persistCredentials: true). As of writing the header is under
              # "http.https://github.com/microsoft/keyborg.extraheader" - if pushing fails, check
              # the "Show environment" step output to see if the format changed.
              - script: |
                  remote_url="`git remote get-url --push origin`"
                  config_key="http.${remote_url%.git}.extraheader"
                  auth_value="`printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n'`"

                  export GIT_CONFIG_COUNT=2
                  export GIT_CONFIG_KEY_0="${config_key}"
                  export GIT_CONFIG_VALUE_0=""
                  export GIT_CONFIG_KEY_1="${config_key}"
                  export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${auth_value}"

                  if [[ -n "${PRERELEASE_TAG:-}" ]]; then
                    yarn release "$RELEASE_INCREMENT" --preRelease "$PRERELEASE_TAG"
                  else
                    yarn release "$RELEASE_INCREMENT"
                  fi
                displayName: Push package update
                condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))
                env:
                  GITHUB_TOKEN: $(createToken.GITHUB_TOKEN)
                  RELEASE_INCREMENT: ${{ parameters.publishVersion }}
                  ${{ if eq(parameters.prerelease, true) }}:
                    PRERELEASE_TAG: ${{ parameters.prereleaseTag }}

              - script: yarn beachball-auth-helper revoke-github-app-token
                displayName: Revoke GitHub App token
                condition: and(always(), ne(variables['createToken.GITHUB_TOKEN'], ''))
                env:
                  TOKEN: $(createToken.GITHUB_TOKEN)
