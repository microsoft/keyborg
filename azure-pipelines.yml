# Build and pack a versioned package without changing git, publish that artifact through ESRP,
# then rerun release-it from the original commit to push the matching version commit and tag.

name: keyborg-release-$(Date:yyyy-MM-dd).$(Rev:rr)

pr: none
trigger: none

# Version bump parameters are set at pipeline queue time.
parameters:
  - name: prerelease
    displayName: Publish a prerelease
    type: boolean
    default: true
  - name: prereleaseTag
    displayName: Prerelease tag
    type: string
    default: canary
  - name: publishVersion
    displayName: Publish version
    type: string
    default: minor
    values:
      - patch
      - minor
      - major
  - name: dryRun
    displayName: Dry run (no publish or push)
    type: boolean
    default: false

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

variables:
  - group: ogx-oss-release
  - template: /.ado/templates/readonly-variables.yml
    parameters:
      variables:
        tags: production
        nodeVersion: 24
        SHELLOPTS: braceexpand:hashall:interactive-comments:errexit:errtrace

        REGISTRY_URL: https://pkgs.dev.azure.com/office/_packaging/Office/npm/registry/
        YARN_NPM_REGISTRY_SERVER: $(REGISTRY_URL)
        YARN_NPM_ALWAYS_AUTH: 1
        YARN_NPMRC_AUTH_ENABLED: 1

        esrpReleaseAzureSubscription: $[variables.grp_esrpReleaseAzureSubscription]
        esrpReleaseClientId: $[variables.grp_esrpReleaseClientId]
        esrpReleaseKeyVaultName: $[variables.grp_esrpReleaseKeyVaultName]
        esrpReleaseTenantId: $[variables.grp_esrpReleaseTenantId]
        esrpSecretNameAuthCert: $[variables.grp_esrpSecretNameAuthCert]
        esrpSecretNameSignCert: $[variables.grp_esrpSecretNameSignCert]
        ghaClientId: $[variables.grp_ghaClientId]
        ghaUserName: $[variables.grp_ghaUserName]
        ghaUserEmail: $[variables.grp_ghaUserEmail]
        ghaTokenAzureSubscription: $[variables.grp_ghaTokenAzureSubscription]
        ghaTokenKeyId: $[variables.grp_ghaTokenKeyId]

        ${{ if eq(parameters.prerelease, true) }}:
          npmDistTag: ${{ parameters.prereleaseTag }}
        ${{ else }}:
          npmDistTag: latest

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
    featureFlags:
      incrementalSDLSourceAnalysis: true
    sdl:
      codeql:
        runSourceLanguagesInSourceAnalysis: true
        enabledOnNonDefaultBranches: false
    settings:
      networkIsolationPolicy: AzureActiveDirectory,AzureKeyVault,AzureStorage,GitHub

    stages:
      - stage: build
        displayName: Build artifacts
        jobs:
          - job: build
            displayName: Build and pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            variables:
              - name: artifactPath
                value: $(Build.StagingDirectory)/packed
                readonly: true
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: packed
                  path: $(artifactPath)
            steps:
              - template: /.ado/templates/setup.yml@self

              - script: mkdir -p '$(artifactPath)'
                displayName: Create package artifact directory

              # Temporarily bump the package version used by npm pack without committing or tagging.
              - ${{ if eq(parameters.prerelease, false) }}:
                  - script: yarn release "$RELEASE_INCREMENT" --ci --no-git
                    displayName: Prepare official release
                    env:
                      RELEASE_INCREMENT: ${{ parameters.publishVersion }}

              - ${{ if eq(parameters.prerelease, true) }}:
                  - script: yarn release "$RELEASE_INCREMENT" --preRelease "$PRERELEASE_TAG" --ci --no-git
                    displayName: Prepare prerelease
                    env:
                      PRERELEASE_TAG: ${{ parameters.prereleaseTag }}
                      RELEASE_INCREMENT: ${{ parameters.publishVersion }}

              # The build runs as a prepack script.
              - script: npm pack --pack-destination '$(artifactPath)'
                displayName: Pack package

              - script: ls -R '$(Build.StagingDirectory)'
                displayName: Show output files

      - stage: publish
        displayName: Publish
        dependsOn: build
        jobs:
          - job: npm_publish
            displayName: Publish npm package
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            variables:
              - name: artifactPath
                value: $(Agent.BuildDirectory)/packed
                readonly: true
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: packed
                  targetPath: $(artifactPath)
            steps:
              - script: ls -R '$(artifactPath)'
                displayName: Show artifact contents

              - task: EsrpRelease@12
                displayName: Publish to npm
                condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))
                inputs:
                  connectedservicename: $(esrpReleaseAzureSubscription)
                  usemanagedidentity: false
                  keyvaultname: $(esrpReleaseKeyVaultName)
                  authcertname: $(esrpSecretNameAuthCert)
                  signcertname: $(esrpSecretNameSignCert)
                  clientid: $(esrpReleaseClientId)
                  domaintenantid: $(esrpReleaseTenantId)
                  contenttype: npm
                  productstate: $(npmDistTag)
                  folderlocation: $(artifactPath)
                  owners: marata@microsoft.com
                  approvers: jukapsia@microsoft.com

      - stage: push
        displayName: Push to git
        dependsOn: publish
        jobs:
          - job: push
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            workspace:
              clean: all
            steps:
              - template: /.ado/templates/setup.yml@self

              - script: |
                  branch_name="${BUILD_SOURCEBRANCH#refs/heads/}"
                  if [[ "$BUILD_SOURCEBRANCH" != refs/heads/* ]]; then
                    echo "Release must run from a branch, not $BUILD_SOURCEBRANCH" >&2
                    exit 1
                  fi
                  git checkout -B "$branch_name" "$BUILD_SOURCEVERSION"
                  git branch --set-upstream-to="origin/$branch_name" "$branch_name"
                displayName: Attach source branch

              - task: AzureCLI@2
                name: createToken
                displayName: Create GitHub App token
                inputs:
                  azureSubscription: $(ghaTokenAzureSubscription)
                  scriptType: bash
                  scriptLocation: inlineScript
                  # This is using the office-ogx-auth-helper app
                  inlineScript: |
                    yarn beachball-auth-helper create-github-app-token \
                      --app-client-id '$(ghaClientId)' \
                      --key-id '$(ghaTokenKeyId)' \
                      --repository '$(Build.Repository.Name)' \
                      --permissions contents:write \
                      --ci-output-name GITHUB_APP_TOKEN

              # Recreate the published version bump, then commit, tag, and push it with release-it.
              # Auth relies on overwriting the persisted extraheader for the remote (a 1ES PT step
              # forces persistCredentials: true). If the format changes later and pushing fails,
              # debug by looking at the "Show environment" step output.
              - script: |
                  remote_url="`git remote get-url --push origin`"
                  auth_value="`printf 'x-access-token:%s' "$GITHUB_APP_TOKEN" | base64 | tr -d '\n'`"
                  header_key="http.${remote_url}.extraheader"
                  original_header="`git config --get "$header_key" || true`"

                  restore_header() {
                    if [[ -n "$original_header" ]]; then
                      git config --replace-all "$header_key" "$original_header"
                    else
                      git config --unset-all "$header_key" || true
                    fi
                  }
                  trap restore_header EXIT

                  git config --replace-all "$header_key" "AUTHORIZATION: basic ${auth_value}"

                  if [[ -n "${PRERELEASE_TAG:-}" ]]; then
                    yarn release "$RELEASE_INCREMENT" --preRelease "$PRERELEASE_TAG" --ci
                  else
                    yarn release "$RELEASE_INCREMENT" --ci
                  fi
                displayName: Push package update
                condition: and(succeeded(), eq(${{ parameters.dryRun }}, false))
                env:
                  GITHUB_APP_TOKEN: $(createToken.GITHUB_APP_TOKEN)
                  RELEASE_INCREMENT: ${{ parameters.publishVersion }}
                  ${{ if eq(parameters.prerelease, true) }}:
                    PRERELEASE_TAG: ${{ parameters.prereleaseTag }}

              - script: yarn beachball-auth-helper revoke-github-app-token
                displayName: Revoke GitHub App token
                condition: and(always(), ne(variables['createToken.GITHUB_APP_TOKEN'], ''))
                env:
                  TOKEN: $(createToken.GITHUB_APP_TOKEN)
