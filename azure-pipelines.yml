pr: none
trigger: none

parameters:
  - name: publishVersion
    displayName: Version increment
    type: string
    default: patch
    values:
      - patch
      - minor
      - major
      - prerelease
  - name: prerelease
    displayName: Publish a prerelease
    type: boolean
    default: false
  - name: prereleaseTag
    displayName: Prerelease tag
    type: string
    default: canary

variables:
  - group: 'Github and NPM secrets'
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - stage: main
        jobs:
          - job: Release
            pool:
              name: '1ES-Host-Ubuntu'
              image: '1ES-PT-Ubuntu-20.04'
              os: linux
            workspace:
              clean: all
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(System.DefaultWorkingDirectory)
                  artifactName: output
            steps:
              - checkout: self
                clean: true
                persistCredentials: true
            
              - task: CmdLine@2
                displayName: Re-attach head
                inputs:
                  script: |
                    git checkout --track "origin/${BUILD_SOURCEBRANCH//refs\/heads\/}"
                    git pull
            
              - task: NodeTool@0
                displayName: Use Node 24.x
                inputs:
                  versionSpec: 24.x
            
              - task: CmdLine@2
                displayName: yarn install
                inputs:
                  script: |
                    corepack enable yarn && corepack install && yarn install --immutable
            
              - task: CmdLine@2
                displayName: Configure git identity
                inputs:
                  script: >-
                    git config user.name "Keyborg Build"
            
                    git config user.email "fluentui-internal@service.microsoft.com"
            
              - task: CmdLine@2
                displayName: Write npmrc for publish token
                inputs:
                  script: echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc

              - task: CmdLine@2
                displayName: Validate release parameters
                condition: and(succeeded(), eq('${{ parameters.publishVersion }}', 'prerelease'), eq(${{ parameters.prerelease }}, false))
                inputs:
                  script: |
                    echo "The prerelease increment requires 'Publish a prerelease' to be enabled."
                    exit 1
            
              - task: CmdLine@2
                displayName: Publish (official)
                condition: and(succeeded(), eq(${{ parameters.prerelease }}, false))
                inputs:
                  script: |
                    yarn release "$RELEASE_INCREMENT" --ci
                    git push --follow-tags
                env:
                  NPM_TOKEN: $(npmToken)
                  RELEASE_INCREMENT: ${{ parameters.publishVersion }}
            
              - task: CmdLine@2
                displayName: Publish (prerelease)
                condition: and(succeeded(), eq(${{ parameters.prerelease }}, true))
                inputs:
                  script: |
                    yarn release "$RELEASE_INCREMENT" --preRelease "$PRERELEASE_TAG" --ci
                    git push --follow-tags
                env:
                  NPM_TOKEN: $(npmToken)
                  PRERELEASE_TAG: ${{ parameters.prereleaseTag }}
                  RELEASE_INCREMENT: ${{ parameters.publishVersion }}